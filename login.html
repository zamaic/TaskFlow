<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Orbes de fondo -->
  <div class="bg-orb"></div>
  <div class="grain"></div>

  <!-- TARJETA PRINCIPAL -->
  <div class="card">

    <!-- BARRA SUPERIOR CON LOGO Y TABS -->
    <div class="card-top">
  <div class="logo-row">
    <div class="logo-icon">
      <img src="img/Vector_Logo_Blanco.png" alt="TaskFlow Logo" class="logo-image" style="width: 24px; height: 24px;"/>
    </div>
    <span class="logo-text">TaskFlow</span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="login">Iniciar Sesión</button>
    <button class="tab-btn" data-tab="signup">Registrarse</button>
    <div class="tab-indicator" id="tabIndicator"></div>
  </div>
</div>

    <!-- CUERPO DE LA TARJETA -->
    <div class="card-body">

      <!-- PANEL LOGIN -->
      <div class="panel active" id="panel-login">
        <p class="panel-title">Bienvenido de vuelta</p>
        <p class="panel-subtitle">Ingresa tus credenciales para continuar.</p>

        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16">
              <path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"/>
            </svg>
            <input type="email" id="loginEmail" placeholder="tu@correo.com" autocomplete="email" />
          </div>
          <span class="field-error" id="loginEmailErr"></span>
        </div>

        <div class="form-group">
          <label for="loginPw">Contraseña</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16">
              <path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-80-48a16,16,0,1,1,16-16A16,16,0,0,1,128,160Z"/>
            </svg>
            <input type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="eye-btn" data-target="loginPw" title="Mostrar/ocultar">
              <svg viewBox="0 0 256 256"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>
            </button>
          </div>
          <span class="field-error" id="loginPwErr"></span>
        </div>

        <button class="btn-submit" id="btnLogin">Entrar al Dashboard</button>

        <div class="divider">o continúa con</div>

        <button class="btn-google" id="btnGoogle">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continuar con Google
        </button>

        <p class="card-note">¿No tienes cuenta? <a class="tab-link" data-tab="signup">Regístrate gratis</a></p>
      </div>

      <!-- PANEL SIGNUP -->
      <div class="panel" id="panel-signup">
        <p class="panel-title">Crea tu cuenta</p>
        <p class="panel-subtitle">Únete a TaskFlow y organiza tus proyectos.</p>

        <div class="form-group">
          <label for="signupName">Nombre completo</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16">
              <path d="M172,120a44,44,0,1,1-44-44A44.05,44.05,0,0,1,172,120Zm60,8A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88.09,88.09,0,0,0-91.47-87.93C77.43,41.89,39.87,81.12,40,128.25a87.65,87.65,0,0,0,22.24,58.16A79.71,79.71,0,0,1,84,165.1a4,4,0,0,1,4.83.32,59.83,59.83,0,0,0,78.28,0,4,4,0,0,1,4.83-.32,79.71,79.71,0,0,1,21.79,21.31A87.62,87.62,0,0,0,216,128Z"/>
            </svg>
            <input type="text" id="signupName" placeholder="Ej. María García" autocomplete="name" />
          </div>
          <span class="field-error" id="signupNameErr"></span>
        </div>

        <div class="form-group">
          <label for="signupEmail">Correo electrónico</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16">
              <path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"/>
            </svg>
            <input type="email" id="signupEmail" placeholder="tu@correo.com" autocomplete="email" />
          </div>
          <span class="field-error" id="signupEmailErr"></span>
        </div>

        <div class="form-group">
          <label for="signupPw">Contraseña</label>
          <div class="input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16">
              <path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-80-48a16,16,0,1,1,16-16A16,16,0,0,1,128,160Z"/>
            </svg>
            <input type="password" id="signupPw" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
            <button type="button" class="eye-btn" data-target="signupPw" title="Mostrar/ocultar">
              <svg viewBox="0 0 256 256"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"/></svg>
            </button>
          </div>
          <!-- Barra de fortaleza -->
          <div class="pw-strength">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
          </div>
          <span class="field-error" id="signupPwErr"></span>
        </div>

        <div class="form-group">
          <label>Rol</label>
          <div class="role-pills">
            <label class="role-pill selected">
              <input type="radio" name="rol" value="Estudiante" checked />
              <span class="pill-icon">🎓</span> Estudiante
            </label>
            <label class="role-pill">
              <input type="radio" name="rol" value="Desarrollador" />
              <span class="pill-icon">💻</span> Dev
            </label>
            <label class="role-pill">
              <input type="radio" name="rol" value="Manager" />
              <span class="pill-icon">📋</span> Manager
            </label>
            <label class="role-pill">
              <input type="radio" name="rol" value="Diseñador" />
              <span class="pill-icon">🎨</span> Diseñador
            </label>
          </div>
          <span class="field-error" id="signupRolErr"></span>
        </div>

        <button class="btn-submit" id="btnSignup">Crear mi cuenta</button>

        <p class="card-note">¿Ya tienes cuenta? <a class="tab-link" data-tab="login">Inicia sesión</a></p>
      </div>

    </div>
  </div>

  <!-- Contenedor de toasts -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="login.js"></script>
</body>
</html>
